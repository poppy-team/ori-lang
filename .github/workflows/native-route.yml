name: native-route

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  native-route:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name != 'linux-gnu' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            toolchain: 1.95.0
            smoke: powershell
          - name: windows-gnu
            os: windows-latest
            toolchain: 1.95.0-x86_64-pc-windows-gnu
            smoke: powershell
          - name: linux-gnu
            os: ubuntu-latest
            toolchain: 1.95.0
            smoke: sh
          - name: macos-x86_64
            os: macos-15-intel
            toolchain: 1.95.0
            smoke: sh
          - name: macos-aarch64
            os: macos-15
            toolchain: 1.95.0
            smoke: sh

    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustc -Vv
          cargo -V

      - name: Test experimental bridge protocol and invalid IR
        if: matrix.name == 'linux-gnu'
        run: cargo test -p ori-bridge-server --test bridge_tests --test invalid_ir --locked

      - name: Configure Windows GNU linker
        if: matrix.name == 'windows-gnu'
        shell: pwsh
        run: |
          "ORI_USE_RUST_LLD=1" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=rust-lld" >> $env:GITHUB_ENV

      - name: Audit Rust dependencies
        if: matrix.name == 'linux-gnu'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

      - name: Enforce incremental rustfmt baseline
        if: matrix.name == 'linux-gnu'
        working-directory: ${{ github.workspace }}
        run: python3 tools/qa/rustfmt_scoped.py

      - name: Check complete workspace
        run: cargo check --workspace --all-targets --locked

      - name: Strict Clippy complete workspace
        if: matrix.name == 'linux-gnu'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test runtime
        run: cargo test -p ori-runtime --locked -- --test-threads=1

      - name: Test native driver integration
        run: cargo test -p ori-driver --test multifile_imports --locked

      - name: Test async diagnostics and runtime bridge
        run: cargo test -p ori-driver --test concurrency_async --locked

      - name: Test diagnostic catalog
        run: cargo test -p ori-driver --test diagnostic_catalog --locked

      - name: Validate documentation coverage and examples
        if: matrix.name == 'linux-gnu'
        working-directory: ${{ github.workspace }}
        run: |
          sh tools/qa/docs_coverage.sh
          sh tools/qa/docs_examples.sh

      - name: Native release package (Windows)
        if: matrix.smoke == 'powershell'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          .\tools\package_native_release.ps1 `
            -PackageRoot "compiler\target\dist\ori-${{ matrix.name }}" `
            -ArchivePath "compiler\target\dist\ori-${{ matrix.name }}.zip" `
            -Overwrite

      - name: Native release package (Unix)
        if: matrix.smoke == 'sh'
        working-directory: ${{ github.workspace }}
        run: |
          sh tools/package_native_release.sh \
            --package-root "compiler/target/dist/ori-${{ matrix.name }}" \
            --archive "compiler/target/dist/ori-${{ matrix.name }}.tar.gz" \
            --force

      - name: Upload native release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ori-${{ matrix.name }}
          path: |
            compiler/target/dist/ori-${{ matrix.name }}.zip
            compiler/target/dist/ori-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # M1: Smoke test on a runner WITHOUT the Rust toolchain installed.
  # Validates end users can use check/run/compile/test without Rust.
  # ------------------------------------------------------------------
  smoke-no-rust-linux:
    name: smoke-no-rust (linux-gnu)
    needs: native-route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system linker only (no Rust)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          # GitHub's hosted image includes Rust for unrelated workflows. Keep
          # the system tools needed by the package smoke, but remove Cargo and
          # rustup locations so this job exercises the no-Rust install path.
          clean_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          echo "PATH=$clean_path" >> "$GITHUB_ENV"
          export PATH="$clean_path"
          if command -v rustc >/dev/null 2>&1; then
            echo "ERROR: rustc is still reachable after PATH sanitization"
            exit 1
          fi
          if command -v cargo >/dev/null 2>&1; then
            echo "ERROR: cargo is still reachable after PATH sanitization"
            exit 1
          fi

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ori-linux-gnu
          path: dist

      - name: Extract release package
        run: |
          mkdir -p ~/ori-smoke
          tar -xzf dist/ori-linux-gnu.tar.gz -C ~/ori-smoke --strip-components=1
          ls -la ~/ori-smoke/

      - name: Smoke — package without Rust
        run: |
          sh tools/smoke_no_rust.sh --package-root ~/ori-smoke

  smoke-no-rust-windows:
    name: smoke-no-rust (windows-msvc)
    needs: native-route
    runs-on: windows-latest
    steps:
      - name: Ensure Rust is not present
        shell: pwsh
        run: |
          $cleanPath = @(
            "$env:SystemRoot\System32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\Wbem",
            "$env:ProgramFiles\Git\cmd",
            "$env:ProgramFiles\7-Zip",
            "$env:ProgramFiles\PowerShell\7",
            "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          ) -join ";"
          $env:Path = $cleanPath
          "Path=$cleanPath" >> $env:GITHUB_ENV
          if (Get-Command rustc -ErrorAction SilentlyContinue) {
            Write-Error "rustc is still reachable after PATH sanitization"
            exit 1
          }
          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            Write-Error "cargo is still reachable after PATH sanitization"
            exit 1
          }

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ori-windows-msvc
          path: dist

      - name: Extract release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE\ori-smoke | Out-Null
          Expand-Archive -Path dist\ori-windows-msvc.zip -DestinationPath $env:USERPROFILE\ori-smoke -Force
          # Zip may contain a top-level folder; flatten if needed
          $ori = Get-ChildItem -Path $env:USERPROFILE\ori-smoke -Recurse -Filter ori.exe | Select-Object -First 1
          if ($null -eq $ori) { throw "ori.exe not found in package" }
          $pkg = $ori.Directory.FullName
          Set-Content -Path $env:TEMP\ori-pkg-path.txt -Value $pkg
          Get-ChildItem $pkg

      - name: Smoke — ori doctor
        shell: pwsh
        run: |
          $pkg = Get-Content $env:TEMP\ori-pkg-path.txt
          & "$pkg\ori.exe" doctor

      - name: Smoke — ori run (JIT)
        shell: pwsh
        run: |
          $pkg = Get-Content $env:TEMP\ori-pkg-path.txt
          $src = @"
          module app.smoke_hello
          import ori.io = io
          main()
              io.println("hello from smoke-no-rust")
          end
          "@
          Set-Content -Path $env:TEMP\hello.orl -Value $src
          $env:ORI_REQUIRE_PACKAGED_RUNTIME = "1"
          & "$pkg\ori.exe" run $env:TEMP\hello.orl

      - name: Smoke — ori compile (AOT)
        shell: pwsh
        run: |
          $pkg = Get-Content $env:TEMP\ori-pkg-path.txt
          $env:ORI_REQUIRE_PACKAGED_RUNTIME = "1"
          & "$pkg\ori.exe" compile $env:TEMP\hello.orl --out $env:TEMP\hello.exe
          & $env:TEMP\hello.exe

      - name: Smoke — ori test
        shell: pwsh
        run: |
          $pkg = Get-Content $env:TEMP\ori-pkg-path.txt
          $src = @"
          module app.smoke_test
          import ori.test = test
          @test
          smoke_test()
              test.assert(true, "smoke test passes")
          end
          "@
          Set-Content -Path $env:TEMP\test.orl -Value $src
          $env:ORI_REQUIRE_PACKAGED_RUNTIME = "1"
          & "$pkg\ori.exe" test $env:TEMP\test.orl

  smoke-no-rust-macos:
    name: smoke-no-rust (macos-x86_64)
    needs: native-route
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure Rust is not present
        run: |
          clean_path="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$clean_path" >> "$GITHUB_ENV"
          export PATH="$clean_path"
          if command -v rustc >/dev/null 2>&1; then
            echo "ERROR: rustc is still reachable after PATH sanitization"
            exit 1
          fi
          if command -v cargo >/dev/null 2>&1; then
            echo "ERROR: cargo is still reachable after PATH sanitization"
            exit 1
          fi

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ori-macos-x86_64
          path: dist

      - name: Extract release package
        run: |
          mkdir -p ~/ori-smoke
          tar -xzf dist/ori-macos-x86_64.tar.gz -C ~/ori-smoke --strip-components=1
          ls -la ~/ori-smoke/

      - name: Smoke — package without Rust
        run: |
          sh tools/smoke_no_rust.sh --package-root ~/ori-smoke
  smoke-no-rust-macos-arm:
    name: smoke-no-rust (macos-aarch64)
    needs: native-route
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure Rust is not present
        run: |
          clean_path="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$clean_path" >> "$GITHUB_ENV"
          export PATH="$clean_path"
          if command -v rustc >/dev/null 2>&1; then
            echo "ERROR: rustc is still reachable after PATH sanitization"
            exit 1
          fi
          if command -v cargo >/dev/null 2>&1; then
            echo "ERROR: cargo is still reachable after PATH sanitization"
            exit 1
          fi

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ori-macos-aarch64
          path: dist

      - name: Extract release package
        run: |
          mkdir -p ~/ori-smoke
          tar -xzf dist/ori-macos-aarch64.tar.gz -C ~/ori-smoke --strip-components=1
          ls -la ~/ori-smoke/

      - name: Smoke — package without Rust
        run: |
          sh tools/smoke_no_rust.sh --package-root ~/ori-smoke

  selfhost-bootstrap:
    name: selfhost-bootstrap (experimental)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Build reference compiler, runtime, and bridge
        working-directory: compiler
        run: cargo build -p ori-driver -p ori-runtime -p ori-bridge-server --locked
      - name: Stage runtime for native compilation
        run: sh tools/stage_native_runtime.sh --profile debug --skip-build
      - name: Verify real Stage 0 → Stage 1 → Stage 2 → Stage 3 and program output
        run: bash tools/qa/test_bootstrap_stages.sh
